<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Campus Connect L&F</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e9ecef; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .btn-admin {
            background-color: #17a2b8; /* Admin color: Info blue */
            border-color: #17a2b8;
            transition: background-color 0.3s;
        }
        .btn-admin:hover {
            background-color: #138496;
            border-color: #138496;
        }
    </style>
</head>
<body>

    <!-- Main Content Area: Login Form -->
    <main class="container">
        <div class="card login-card mx-auto">
            <header class="text-center mb-4">
                <h1 class="h3 fw-bolder text-info">Admin Portal Login</h1>
                <p class="text-muted">Campus Connect Lost & Found Management</p>
            </header>

            <form id="adminLoginForm" class="needs-validation" novalidate>
                <!-- Username Field -->
                <div class="mb-3">
                    <label for="adminUsername" class="form-label fw-bold">Username</label>
                    <input type="text" class="form-control" id="adminUsername" value="admin" required>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>

                <!-- Password Field -->
                <div class="mb-4">
                    <label for="adminPassword" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="adminPassword" value="password123" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <!-- Login Button -->
                <div class="d-grid gap-2 mb-3">
                    <!-- Note: On successful login, this will redirect to admin_dashboard.html -->
                    <button class="btn btn-admin text-white fw-bold py-2" type="submit">Log In</button>
                </div>

                <!-- Back to Client Site Link -->
                <div class="text-center mt-3">
                    <a href="index.html" class="text-secondary small">← Back to Public Site</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Load Bootstrap JS Bundle and Custom JS for Login Logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict'

            var form = document.getElementById('adminLoginForm');
            var usernameInput = document.getElementById('adminUsername');
            var passwordInput = document.getElementById('adminPassword');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Stop default submission

                if (!form.checkValidity()) {
                    event.stopPropagation();
                } else {
                    // Simple static login logic for demonstration
                    const validUsername = 'admin';
                    const validPassword = 'password123';

                    if (usernameInput.value === validUsername && passwordInput.value === validPassword) {
                        // Redirect to the Admin Dashboard upon successful login
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        // Display error message (using a custom method instead of alert)
                        displayLoginError('Invalid username or password. Please try again.');
                    }
                }
                form.classList.add('was-validated');
            }, false);

            function displayLoginError(message) {
                // Check if an error element already exists
                let errorDiv = document.getElementById('loginError');
                if (!errorDiv) {
                    errorDiv = document.createElement('div');
                    errorDiv.id = 'loginError';
                    errorDiv.className = 'alert alert-danger mt-3 text-center';
                    errorDiv.setAttribute('role', 'alert');
                    form.parentElement.insertBefore(errorDiv, form.nextSibling); // Insert after the form
                }
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';

                // Hide the error after 5 seconds
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
